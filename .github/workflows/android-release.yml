name: Build FongMi APK
on:
  workflow_dispatch: # 手动触发打包

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mobile(手机 arm64 Release) APK
        run: ./gradlew :app:assembleMobileArm64_v8aRelease

      - name: Build Leanback(电视TV arm64 Release) APK
        run: ./gradlew :app:assembleLeanbackArm64_v8aRelease

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-APK
          path: app/build/outputs/apk/mobileArm64_v8a/release/*.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK
          path: app/build/outputs/apk/leanbackArm64_v8a/release/*.apk
