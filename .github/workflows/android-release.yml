name: Build FongMi APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 自动生成 local.properties，写入SDK路径
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 直接使用系统gradle，不再执行gradle wrapper
      - name: Build Mobile APK
        run: gradle :app:assembleMobileArm64V8aRelease

      - name: Build TV APK
        run: gradle :app:assembleLeanbackArm64V8aRelease

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-APK
          path: app/build/outputs/apk/mobileArm64V8a/release/*.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK
          path: app/build/outputs/apk/leanbackArm64V8a/release/*.apk
