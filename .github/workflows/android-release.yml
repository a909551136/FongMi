name: Build FongMi APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Mobile APK
        run: ./gradlew :app:assembleMobileArm64_v8aRelease

      - name: Build TV APK
        run: ./gradlew :app:assembleLeanbackArm64_v8aRelease

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-APK
          path: app/build/outputs/apk/mobileArm64_v8a/release/*.apk

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK
          path: app/build/outputs/apk/leanbackArm64_v8a/release/*.apk
