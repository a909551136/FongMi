name: Build FongMi APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 关键：在gradle运行之前创建local.properties，防止项目配置阶段找不到文件
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build leanback(TV) APK
        run: gradle :app:assembleLeanbackRelease

      - name: Build mobile(手机) APK
        run: gradle :app:assembleMobileRelease

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-APK
          path: app/build/outputs/apk/leanback/release/*.apk

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-APK
          path: app/build/outputs/apk/mobile/release/*.apk
